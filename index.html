  <h1>关于游戏明日方舟的介绍</h1>
  <img src="ss.png" alt="明日方舟">
  <h2>一句话介绍</h2>
  <p>明日方舟是一款由鹰角网络开发的策略塔防手游，玩家将作为"博士"带领罗德岛的干员们对抗天灾与矿石病。</p>
  <h2>一句话夸奖</h2>
  <p>明日方舟以精美的画风、出色的配乐和富有深度的剧情，成为了国产手游中的标杆之作。</p>
  <h2>玩法介绍</h2>
  <ul>
    <li>策略塔防：合理部署干员，阻挡并消灭敌人</li>
    <li>角色养成：收集并培养各具特色的干员</li>
    <li>剧情探索：体验丰富的主线与活动剧情</li>
    <li>联机合作：与好友一起挑战危机合约</li>
  </ul>
